name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow_user
          POSTGRES_PASSWORD: taskflow_password
          POSTGRES_DB: taskflow_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Execution Order: Lint -> Format Check -> Type Check -> Migrations -> Tests & Coverage
      - name: Run Ruff Linting
        run: ruff check app tests

      - name: Run Ruff Formatting Check
        run: ruff format --check app tests

      - name: Run Type Checking (Mypy)
        run: mypy app --ignore-missing-imports

      - name: Apply Alembic Migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql://taskflow_user:taskflow_password@localhost:5432/taskflow_test_db
        run: alembic upgrade head

      - name: Run Pytest Suite with Coverage
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite:///:memory:
          TEST_DATABASE_URL: postgresql://taskflow_user:taskflow_password@localhost:5432/taskflow_test_db
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=70

  frontend-quality:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Node Dependencies
        run: npm ci

      # Execution Order: Lint -> Tests -> Production Build
      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Run Frontend Tests (Vitest)
        run: npm test

      - name: Build Production Bundle (Vite)
        run: npm run build
